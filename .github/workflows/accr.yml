on:
  push:
    paths:
    - 'accr/README.md'
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 拉取仓库
      uses: actions/checkout@v4
    
    - uses: aliyun/acr-login@v1
      with:
        region-id: 'crpi-qqjr4xowoqr9zwh0.cn-beijing.personal.cr.aliyuncs.com'
        access-key-id: "${{ secrets.ACCR_ACCESSKEYID }}"
        access-key-secret: "${{ secrets.ACCR_ACCESSKEYSECRET }}"

    - name: test
      run: |
        docker images
        docker logout
